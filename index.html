  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --text-primary: #e8eaf0;

      --scrollbar-w: 6px;
    }
    html { font-size: 14px; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-base); color: var(--text-primary); min-height: 100vh; overflow: hidden; }
    ::-webkit-scrollbar { width: var(--scrollbar-w); height: var(--scrollbar-w); }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a3050; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4268; }
    #root { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; white-space: nowrap; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: none; outline: none; transition: all 0.18s ease; letter-spacing: 0.2px; white-space: nowrap; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 0 20px rgba(79,124,255,0.35); }
    .btn-primary:hover { background: #6b93ff; box-shadow: 0 0 28px rgba(79,124,255,0.5); }
    .btn-secondary { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-light); }
    .btn-secondary:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--accent); }
    .btn-danger { background: var(--red-soft); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-success { background: var(--green-soft); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .btn-success:hover { background: rgba(34,197,94,0.25); }
    .btn-amber { background: var(--amber-soft); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
    .btn-amber:hover { background: rgba(245,158,11,0.25); }
    select, textarea, input { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-light); border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; transition: border-color 0.15s; }
    select:focus, textarea:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    select { padding: 7px 10px; cursor: pointer; }
    select option { background: var(--bg-elevated); }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    .slide-right { animation: slideRight 0.2s ease; }
    @keyframes slideRight { from { opacity:0; transform:translateX(12px); } to { opacity:1; transform:translateX(0); } }
    .mono { font-family: 'JetBrains Mono', monospace; }

const BATCH_01 = {"batch_id":"01_initial","batch_date":"2026-08-21","timezone":"Asia/Kolkata","records":[{"source_type":"call","source_id":"a1b2c3d4-0001-4abc-8def-000000000001","record_ref":"C01","revision":1,"company":"Nexus Retail Pvt Ltd","rep_name":"Arjun Mehta","timestamp":"2026-08-21T09:05:00+05:30","duration_seconds":312,"has_transcript":true,"is_silent":false,"auto_route":"Sales Coaching","transcript":"Arjun Mehta: Good morning! May I speak with Mr. Kapoor?\nProspect: Speaking.\nArjun Mehta: Hi Mr. Kapoor, this is Arjun from Volopay. I was hoping to connect about your expense management needs.\nProspect: We already use a tool. Not interested.\nArjun Mehta: Totally understand! Could I ask which tool, just for my knowledge?\nProspect: I'd rather not say. Please remove me from your list.\nArjun Mehta: Of course, I'll do that right away. Sorry for interrupting your day.\nProspect: No worries. Bye.\nArjun Mehta: Have a great day!","ai_summary":{"executive":"Cold call to Nexus Retail resulting in an immediate rejection. Prospect cited existing tooling and requested removal from outreach list.","evidence":"Prospect stated: 'We already use a tool. Not interested.' and 'Please remove me from your list.'","negative_scope":"No information about the competitor tool used. No indication of future interest or re-engagement window. No pain point surfaced.","action_items":"Arjun Mehta to remove Mr. Kapoor (Nexus Retail) from outreach list immediately. Manager to review cold call opener script with Arjun — no value proposition was delivered before the prospect disengaged."}},{"source_type":"call","source_id":"a1b2c3d4-0002-4abc-8def-000000000002","record_ref":"C02","revision":1,"company":"Bluewave Technologies","rep_name":"Priya Sharma","timestamp":"2026-08-21T09:20:00+05:30","duration_seconds":784,"has_transcript":true,"is_silent":false,"auto_route":"Deal Next Steps","transcript":"Priya Sharma: Hi Sarah, thanks for picking up. This is Priya from Volopay.\nSarah Chen: Oh Priya! Yes, we were expecting your call. Our CFO Ravi is also on the line.\nRavi Patel: Hi Priya. We reviewed the proposal you sent last week.\nPriya Sharma: Great! Any questions from your end?\nRavi Patel: We like the spend analytics dashboard. But we have 3 entities across India, Singapore, and Dubai. Can the platform handle multi-entity consolidation?\nPriya Sharma: Absolutely. Multi-entity is a core feature. You can have separate entity wallets with consolidated reporting at the group level.\nSarah Chen: That's exactly what we need. What about local compliance? Singapore GST, UAE VAT?\nPriya Sharma: Yes, our compliance module handles both. It auto-categorizes transactions for GST and VAT filing.\nRavi Patel: Impressive. What would be the implementation timeline for 3 entities?\nPriya Sharma: Typically 4–6 weeks for full onboarding with 3 entities. We assign a dedicated implementation manager.\nRavi Patel: Good. We'll need to loop in our IT head before finalizing. Can you send a technical architecture document?\nPriya Sharma: Of course, I'll send it today. Should we schedule a technical deep-dive call for next week?\nRavi Patel: Yes, please. Thursday works for us.\nPriya Sharma: Perfect. I'll block Thursday 3 PM IST. Thank you both!","ai_summary":{"executive":"Qualified discovery-to-proposal call with Bluewave Technologies CFO and Finance Director. Multi-entity support confirmed as a key requirement. Strong buying signals — requesting technical documentation and scheduling a follow-up technical deep-dive.","evidence":"CFO Ravi Patel: 'We like the spend analytics dashboard... Can the platform handle multi-entity consolidation?' Confirmed follow-up: 'Can you send a technical architecture document?' and agreed to Thursday deep-dive.","negative_scope":"No signed LOI or verbal commitment to purchase. IT head has not yet been consulted — technical blockers may emerge. Pricing negotiation has not commenced.","action_items":"Priya Sharma to send technical architecture document today. Block Thursday 3 PM IST for technical deep-dive with Bluewave IT head + CFO team."}},{"source_type":"call","source_id":"a1b2c3d4-0003-4abc-8def-000000000003","record_ref":"C03","revision":1,"company":"Meridian Pharma","rep_name":"Rohan Verma","timestamp":"2026-08-21T09:45:00+05:30","duration_seconds":540,"has_transcript":true,"is_silent":false,"auto_route":"Deal Next Steps","transcript":"Rohan Verma: Hello Dr. Mishra, this is Rohan from Volopay. How are you doing today?\nDr. Mishra: I'm well, Rohan. We've been looking at your platform closely.\nRohan Verma: Glad to hear it. Is there anything specific you'd like to revisit?\nDr. Mishra: Yes — the approval workflow. Our procurement team needs 3-level approval before any spend above ₹50,000. Does that exist?\nRohan Verma: Yes, you can configure multi-level approval workflows with custom spend thresholds. It's fully parameterizable.\nDr. Mishra: Good. Our CFO is travelling next week. Can we close the paperwork after the 28th?\nRohan Verma: Of course. I'll prepare the MSA and data processing agreement for your review this week, so you have time to read through before the 28th.\nDr. Mishra: That works. Also, will there be a UAT environment?\nRohan Verma: Yes, we provide a sandbox UAT environment for all enterprise clients. Typically 2 weeks before go-live.\nDr. Mishra: Excellent. We're close to a decision, Rohan. You'll hear from us after CFO returns.\nRohan Verma: Thank you, Dr. Mishra. I'll send the documents today.","ai_summary":{"executive":"Strong late-stage deal conversation with Meridian Pharma. Prospect confirmed 3-level approval workflow requirement (met by Volopay). Deal expected to close after CFO returns from travel on 28 August.","evidence":"Dr. Mishra stated: 'We're close to a decision, Rohan. You'll hear from us after CFO returns.'","negative_scope":"Deal not yet signed. CFO approval is still pending — timeline contingent on return from travel. No pricing confirmed on this call.","action_items":"Rohan Verma to send MSA and DPA to Dr. Mishra today. Follow up after 28 August when CFO returns."}},{"source_type":"call","source_id":"a1b2c3d4-0004-4abc-8def-000000000004","record_ref":"C04","revision":1,"company":"Starfield Logistics","rep_name":"Sneha Patel","timestamp":"2026-08-21T10:00:00+05:30","duration_seconds":621,"has_transcript":true,"is_silent":false,"auto_route":"Deal Next Steps","transcript":"Sneha Patel: Hi Anand, Sneha here from Volopay. Do you have 10 minutes?\nAnand Kumar: Sure, Sneha. We actually had a team discussion about your platform yesterday.\nSneha Patel: That's great to hear! Any specific outcomes from the discussion?\nAnand Kumar: Mostly positive. The card issuance feature is exactly what our field ops team needs — they're spending on fuel and tolls daily.\nSneha Patel: Perfect. Prepaid cards for field ops with spend limits and category locks is something we do really well.\nAnand Kumar: Right. But our finance team is asking about credit — can field cards run on a credit line rather than prepaid?\nSneha Patel: Yes, we offer corporate credit cards with a shared credit line. The limit is subject to an eligibility assessment.\nAnand Kumar: What determines eligibility?\nSneha Patel: We look at company revenue, vintage, and banking history. Starfield Logistics should qualify for a decent limit given your scale.\nAnand Kumar: Our last fiscal revenue was ₹85 crores. That should be fine, right?\nSneha Patel: That's encouraging — though final assessment is done by our credit team. I can initiate the credit assessment if you'd like.\nAnand Kumar: Yes, please do. When can we expect a decision?\nSneha Patel: Typically 3–5 business days post application.\nAnand Kumar: Alright. Send me the application link.\nSneha Patel: Will do immediately after this call!","ai_summary":{"executive":"Positive discovery call with Starfield Logistics field ops use-case. Prospect wants corporate credit cards for fuel/toll spend. Credit assessment to be initiated.","evidence":"Anand Kumar: 'The card issuance feature is exactly what our field ops team needs.' Agreed to start credit assessment. Revenue stated as ₹85 crores.","negative_scope":"Credit eligibility is NOT confirmed — subject to formal credit team assessment. No deal signed or verbal commitment given beyond 'initiate assessment'.","action_items":"Sneha Patel to send credit assessment application link to Anand Kumar immediately. Credit team to run assessment within 3–5 business days."}},{"source_type":"call","source_id":"a1b2c3d4-0005-4abc-8def-000000000005","record_ref":"C05","revision":1,"company":"Cascade Fintech","rep_name":"Vikram Singh","timestamp":"2026-08-21T10:30:00+05:30","duration_seconds":890,"has_transcript":true,"is_silent":false,"auto_route":"Deal Next Steps","transcript":"Vikram Singh: Hi Neha, Vikram from Volopay. How's the evaluation going?\nNeha Joshi: Hi Vikram! Actually quite well. Our team loves the demo. The accounts payable automation is a big draw.\nVikram Singh: Great feedback. Any remaining concerns?\nNeha Joshi: Pricing. We're a 150-person fintech, and the per-card pricing feels steep if we scale to all employees.\nVikram Singh: Understood. At your scale, you'd move to an enterprise tier with volume discounts. What's your expected card count?\nNeha Joshi: Roughly 200 virtual + 80 physical.\nVikram Singh: At that volume, I can work with our pricing team to give you a blended rate. I'm confident we can make it work.\nNeha Joshi: That would help. Also — we're regulated under RBI guidelines. Any compliance concerns?\nVikram Singh: None. We're RBI-regulated, PCI-DSS compliant, and our data centers are in India. All data stays onshore.\nNeha Joshi: Perfect. That's a hard requirement for us. Alright — if pricing comes in right, I think we can move forward.\nVikram Singh: Let me get custom pricing from our team by EOD tomorrow.\nNeha Joshi: Sounds good. Looking forward to it!","ai_summary":{"executive":"Advanced evaluation stage with Cascade Fintech. Strong product fit confirmed. Pricing is the only remaining blocker. Custom pricing proposal to be issued EOD tomorrow.","evidence":"Neha Joshi: 'If pricing comes in right, I think we can move forward.' Volume confirmed: 200 virtual + 80 physical cards.","negative_scope":"No pricing commitment made on this call. Deal is conditional on custom pricing approval by Volopay pricing team. No contract or LOI issued.","action_items":"Vikram Singh to get custom pricing from pricing team and send to Neha Joshi by EOD 22 August 2026."}},{"source_type":"call","source_id":"a1b2c3d4-0006-4abc-8def-000000000006","record_ref":"C06","revision":1,"company":"Ironclad Manufacturing","rep_name":"Kavya Nair","timestamp":"2026-08-21T10:50:00+05:30","duration_seconds":430,"has_transcript":true,"is_silent":false,"auto_route":"Sales Coaching","transcript":"Kavya Nair: Good morning! Is this Mr. Desai from Ironclad?\nMr. Desai: Yes, who's this?\nKavya Nair: This is Kavya from Volopay — we help manufacturing companies streamline expense management and procurement workflows.\nMr. Desai: We manage expenses just fine with our ERP. No need for another tool.\nKavya Nair: Of course, many of our clients have ERP systems too. We actually integrate with SAP and Oracle. The value add is real-time card controls and analytics on top of your existing ERP.\nMr. Desai: Sounds like a solution looking for a problem. We're not interested.\nKavya Nair: Fair enough, Mr. Desai. If you ever reconsider, I'm happy to share a case study from a similar manufacturer.\nMr. Desai: Sure. Email is fine.\nKavya Nair: I'll send it right away. Thank you for your time!","ai_summary":{"executive":"Cold call rejection from Ironclad Manufacturing. Prospect dismissed product as unnecessary given existing ERP. Agreed to receive a case study via email.","evidence":"Mr. Desai: 'Sounds like a solution looking for a problem. We're not interested.' Later: 'Email is fine.'","negative_scope":"No buying interest expressed. Case study email does not constitute engagement or a sales opportunity.","action_items":"Kavya Nair to send manufacturing ERP-integration case study to Mr. Desai. Manager to review pitch — ERP objection handling needs strengthening."}},{"source_type":"call","source_id":"a1b2c3d4-0007-4abc-8def-000000000007","record_ref":"C07","revision":1,"company":"Prism Digital Media","rep_name":"Arjun Mehta","timestamp":"2026-08-21T11:10:00+05:30","duration_seconds":712,"has_transcript":true,"is_silent":false,"auto_route":"Deal Next Steps","transcript":"Arjun Mehta: Hi Pallavi, hope you're doing well. Arjun from Volopay.\nPallavi Rao: Hi Arjun! Yes, we've been meaning to call you. Our ad spend is out of control — we need better controls.\nArjun Mehta: That's exactly what we solve. Tell me more — what does your current ad spend workflow look like?\nPallavi Rao: We have 12 media buyers who each have access to a shared credit card. Reconciliation is a nightmare.\nArjun Mehta: With Volopay, each media buyer gets their own virtual card with a spend limit and category lock to ad platforms only. No shared cards.\nPallavi Rao: That would be a game changer. What about the reporting — can we see spend per buyer, per campaign?\nArjun Mehta: Yes, full drill-down. You can see spend by person, vendor, date range, or custom tags.\nPallavi Rao: Perfect. How long would it take to get us set up?\nArjun Mehta: For a 12-person team, about a week. We'll assign an onboarding manager.\nPallavi Rao: We'd like to move fast. Can we start the sign-up process this week?\nArjun Mehta: Absolutely. I'll send you the onboarding link today.\nPallavi Rao: Great, looking forward to it!","ai_summary":{"executive":"High-intent inbound-style call with Prism Digital Media. Media agency with 12 buyers and out-of-control shared credit card spend. Prospect eager to sign up this week.","evidence":"Pallavi Rao: 'Can we start the sign-up process this week?' and 'Great, looking forward to it!'","negative_scope":"No contract signed. Onboarding link not yet sent at time of call. Final decision-maker (CFO/CEO) not confirmed as involved.","action_items":"Arjun Mehta to send onboarding link to Pallavi Rao today. Flag as high-velocity deal — target close this week."}},{"source_type":"call","source_id":"a1b2c3d4-0008-4abc-8def-000000000008","record_ref":"C08","revision":1,"company":"Quantum Energy Solutions","rep_name":"Priya Sharma","timestamp":"2026-08-21T11:35:00+05:30","duration_seconds":556,"has_transcript":true,"is_silent":false,"auto_route":"Customer Escalation / Bug","transcript":"Priya Sharma: Hi Deepak, Priya from Volopay. How are you finding the platform so far?\nDeepak Nair: Honestly, Priya, we've had a rough week. Three of our card transactions were declined without any reason shown in the dashboard.\nPriya Sharma: I'm really sorry to hear that, Deepak. Let me pull up your account. Can you share the transaction dates?\nDeepak Nair: August 18, 19, and 20. All were vendor payments — all declined. We had credit available.\nPriya Sharma: I can see them — these were declined due to a system-side velocity check that was incorrectly applied. This should not have happened.\nDeepak Nair: We nearly missed a supplier payment because of this. This is serious.\nPriya Sharma: Absolutely, I fully understand the severity. I'm escalating this right now to our payments ops team. You should receive a call within 2 hours.\nDeepak Nair: Please make sure this doesn't happen again. We are in our first month of usage.\nPriya Sharma: I give you my word. We'll also review the velocity configuration on your account and apply a fix today.\nDeepak Nair: Alright. I'll wait for the ops team's call.","ai_summary":{"executive":"Critical customer escalation — Quantum Energy Solutions experienced 3 transaction declines in their first month of use due to an incorrectly applied velocity check. Immediate escalation to payments ops required.","evidence":"Deepak Nair: 'Three of our card transactions were declined without any reason shown.' Priya confirmed: 'declined due to a system-side velocity check that was incorrectly applied.'","negative_scope":"Root cause is system-side, not user error. Fix not yet confirmed applied on this call. Customer satisfaction at serious risk given early-stage of relationship.","action_items":"Priya Sharma to escalate to payments ops immediately — ops team to call Deepak Nair within 2 hours. Velocity config to be reviewed and fixed today. Incident to be documented for post-mortem."}},{"source_type":"call","source_id":"a1b2c3d4-0009-4abc-8def-000000000009","record_ref":"C09","revision":1,"company":"UrbanRoot Agritech","rep_name":"Rohan Verma","timestamp":"2026-08-21T12:00:00+05:30","duration_seconds":460,"has_transcript":true,"is_silent":false,"auto_route":"Deal Next Steps","transcript":"Rohan Verma: Hi Sunita, this is Rohan from Volopay.\nSunita Reddy: Hi Rohan! We just completed our internal evaluation. Good news — we want to proceed.\nRohan Verma: That's wonderful to hear! What are the next steps from your side?\nSunita Reddy: Our legal team needs to review the MSA. Can you send a clean copy?\nRohan Verma: Absolutely, I'll send it by noon today. Is there a specific legal contact I should address it to?\nSunita Reddy: Yes — cc Rahul Gupta, our General Counsel, at r.gupta@urbanroot.in.\nRohan Verma: Got it. I'll address it to Rahul and cc you. Expected review time?\nSunita Reddy: 3–4 business days. Then we can sign.\nRohan Verma: Perfect. I'll also send our standard data processing addendum for DPDP compliance.\nSunita Reddy: Good thinking. We'll review both together.\nRohan Verma: Excellent. I'll send both documents in the next hour.","ai_summary":{"executive":"UrbanRoot Agritech confirmed they want to proceed after internal evaluation. MSA and DPA to be sent to legal team for 3–4 day review. Deal imminent.","evidence":"Sunita Reddy: 'We just completed our internal evaluation. Good news — we want to proceed.' and '3–4 business days. Then we can sign.'","negative_scope":"Contract not yet signed. Legal review may surface redlines or blockers. No implementation date confirmed.","action_items":"Rohan Verma to send MSA and DPA to Sunita Reddy and r.gupta@urbanroot.in within 1 hour. Follow up after 3–4 business days for legal sign-off."}},{"source_type":"call","source_id":"a1b2c3d4-0010-4abc-8def-000000000010","record_ref":"C10","revision":1,"company":"Orion Healthcare Group","rep_name":"Sneha Patel","timestamp":"2026-08-21T12:20:00+05:30","duration_seconds":380,"has_transcript":true,"is_silent":false,"auto_route":"Sales Coaching","transcript":"Sneha Patel: Good afternoon, this is Sneha from Volopay. May I please speak with Mr. Sharma?\nReceptionist: Mr. Sharma is in a meeting. Can I take a message?\nSneha Patel: Of course. Please tell him Sneha from Volopay called about our corporate card solution for healthcare. I'll try again this afternoon.\nReceptionist: I'll let him know.\nSneha Patel: Thank you. Have a great day.\n[Second attempt 2 hours later]\nSneha Patel: Hi, I called earlier for Mr. Sharma. This is Sneha from Volopay.\nMr. Sharma: Yes, what is this regarding?\nSneha Patel: We offer corporate expense management for healthcare groups — specifically helping manage vendor payments and reimbursements.\nMr. Sharma: We already handle this internally. Not something we're looking to change.\nSneha Patel: Understood. Could I send over some information on healthcare-specific use cases?\nMr. Sharma: Sure, send it to the general inbox. I'll look when I can.\nSneha Patel: Thank you, Mr. Sharma. Have a good day.","ai_summary":{"executive":"Gatekeeper difficulty and then weak engagement from Mr. Sharma at Orion Healthcare. No pain point expressed. Agreed to receive info to general inbox — low conversion signal.","evidence":"Mr. Sharma: 'We already handle this internally. Not something we're looking to change.'","negative_scope":"No buying interest. Info to general inbox is a soft rejection. No follow-up commitment from prospect.","action_items":"Sneha Patel to send healthcare-specific use case material to Orion Healthcare general inbox. Manager: review Sneha's gatekeeper navigation technique — second call opened without a compelling hook."}},{"source_type":"call","source_id":"a1b2c3d4-0011-4abc-8def-000000000011","record_ref":"C11","revision":1,"company":"Vertex Capital Partners","rep_name":"Vikram Singh","timestamp":"2026-08-21T12:45:00+05:30","duration_seconds":920,"has_transcript":true,"is_silent":false,"auto_route":"Deal Next Steps","transcript":"Vikram Singh: Hi Aarav, Vikram from Volopay. Good to connect again.\nAarav Mehta: Vikram! Yes — we've been comparing you to two other vendors. Can you help me understand your investment management module?\nVikram Singh: Of course. For PE/VC firms, we offer portfolio company card management — you can issue cards to portcos with your branding and controls.\nAarav Mehta: Interesting. We have 14 portfolio companies. Can each have a separate wallet with its own limits?\nVikram Singh: Yes. Each portco entity gets its own sub-account with isolated limits, reporting, and approval workflows.\nAarav Mehta: What about consolidated billing? Our finance team wants one invoice for all portcos.\nVikram Singh: Absolutely — consolidated billing at the master account level with entity-level drill-down reports.\nAarav Mehta: This is exactly what we need. The other vendors couldn't do consolidated billing properly.\nVikram Singh: That's a common gap we fill. Would you like a technical walkthrough with our solutions engineer?\nAarav Mehta: Yes. Let's do it next Monday.\nVikram Singh: I'll send a calendar invite for Monday morning.\nAarav Mehta: Perfect. Looking forward to it.","ai_summary":{"executive":"Strong competitive differentiation call with Vertex Capital Partners. Confirmed ability to support 14 portcos with consolidated billing — a capability competitors lacked. Technical walkthrough scheduled for Monday.","evidence":"Aarav Mehta: 'This is exactly what we need. The other vendors couldn't do consolidated billing properly.'","negative_scope":"No pricing discussed. Deal is still in competitive evaluation — two other vendors also being assessed. No commitment made.","action_items":"Vikram Singh to send Monday morning calendar invite for technical walkthrough with solutions engineer. Flag as high-priority competitive deal."}},{"source_type":"call","source_id":"a1b2c3d4-0012-4abc-8def-000000000012","record_ref":"C12","revision":1,"company":"Pinnacle Retail Chain","rep_name":"Kavya Nair","timestamp":"2026-08-21T13:05:00+05:30","duration_seconds":648,"has_transcript":true,"is_silent":false,"auto_route":"Customer Escalation / Bug","transcript":"Kavya Nair: Hi Mrs. Pillai, Kavya from Volopay. Is this a good time?\nMrs. Pillai: Kavya — I was about to call you. Our store managers cannot add receipts to transactions on the mobile app. It crashes every time.\nKavya Nair: I'm so sorry to hear that. When did this start?\nMrs. Pillai: Two days ago. It's affecting 24 store locations. Managers can't submit expense reports.\nKavya Nair: This is definitely a priority issue. I'm logging a P1 ticket right now. Can you tell me the device type and OS version?\nMrs. Pillai: All Android — mostly Samsung, Android 14.\nKavya Nair: Got it. Our engineering team has an open bug on receipt upload on Android 14. A patch was deployed yesterday — but it may need a force reinstall.\nMrs. Pillai: Nobody told us about this. We spent 2 days troubleshooting.\nKavya Nair: I sincerely apologize. I should have proactively informed you. I'll send the reinstall steps to all 24 store managers immediately. And I'll escalate for a credit on your next invoice for the disruption.\nMrs. Pillai: The credit would be appreciated. Please make sure this doesn't happen again.\nKavya Nair: Absolutely, Mrs. Pillai. I'll also ensure you're on our proactive incident notification list going forward.","ai_summary":{"executive":"Customer escalation — Pinnacle Retail Chain (24 locations) experienced 2-day disruption due to Android 14 receipt upload crash bug. Patch exists; customer not proactively notified. Invoice credit offered.","evidence":"Mrs. Pillai: 'Our store managers cannot add receipts to transactions on the mobile app. It crashes every time.' Kavya confirmed: 'Our engineering team has an open bug on receipt upload on Android 14.'","negative_scope":"Credit amount not quantified. Whether all 24 managers will successfully reinstall is unconfirmed. Root cause of notification gap (no proactive comms) not addressed at process level.","action_items":"Kavya Nair to send Android 14 reinstall instructions to all 24 Pinnacle store managers immediately. Initiate invoice credit with billing team. Add Pinnacle to proactive incident notification list. Manager: review proactive communication process for known bugs."}},{"source_type":"call","source_id":"a1b2c3d4-0013-4abc-8def-000000000013","record_ref":"C13","revision":1,"company":"SkyBridge Consulting","rep_name":"Arjun Mehta","timestamp":"2026-08-21T13:30:00+05:30","duration_seconds":710,"has_transcript":true,"is_silent":false,"auto_route":"Internal / Vendor Strategy","transcript":"Arjun Mehta: Hi Rajan, Arjun from Volopay. Thanks for agreeing to connect on this.\nRajan Iyer: Of course. Your team reached out about a potential reseller partnership?\nArjun Mehta: Yes. We're building out a consulting partner channel. Given SkyBridge's client base in the mid-market SME space, we think there's a strong fit.\nRajan Iyer: Interesting. What does the partnership look like — referral or resell?\nArjun Mehta: Either works for us. Referral is simpler — you introduce clients, we close, you get a commission. Resell is deeper — you manage the client relationship and billing.\nRajan Iyer: Our clients trust us for tech recommendations. Referral makes more sense to start.\nArjun Mehta: That works. Commission is 15% of first-year ACV for each referred client that converts.\nRajan Iyer: That's competitive. We have about 30 clients who could potentially benefit.\nArjun Mehta: Excellent. I'll send over the partner agreement and onboarding docs this week.\nRajan Iyer: Sounds good. Looking forward to reviewing.","ai_summary":{"executive":"Promising reseller/referral partnership discussion with SkyBridge Consulting. Referral model agreed upon. 15% first-year ACV commission discussed. Partner agreement to be sent this week.","evidence":"Rajan Iyer: 'Our clients trust us for tech recommendations. Referral makes more sense to start.' and '15% is competitive. We have about 30 clients who could potentially benefit.'","negative_scope":"No partnership agreement signed. Client referrals from SkyBridge are speculative — no names or timelines given. Commission structure to be formalized in writing.","action_items":"Arjun Mehta to send partner agreement and onboarding docs to Rajan Iyer this week. Flag to partnerships/BD team for pipeline tracking."}},{"source_type":"call","source_id":"a1b2c3d4-0014-4abc-8def-000000000014","record_ref":"C14","revision":1,"company":"Oasis Foods & Beverages","rep_name":"Priya Sharma","timestamp":"2026-08-21T14:00:00+05:30","duration_seconds":589,"has_transcript":true,"is_silent":false,"auto_route":"Deal Next Steps","transcript":"Priya Sharma: Good afternoon Meera, Priya here from Volopay.\nMeera Srinivasan: Hi Priya! Great timing — our procurement head just approved moving ahead with a pilot.\nPriya Sharma: That's fantastic! What's the scope of the pilot?\nMeera Srinivasan: We want to run 30 virtual cards for our vendor payments team for 3 months.\nPriya Sharma: Perfect. 30 cards, 3 months. I'll configure a pilot workspace with spend limits preset for your category — food procurement typically categorizes into raw materials and packaging.\nMeera Srinivasan: Yes, those two categories. Can we have different limits per category?\nPriya Sharma: Absolutely — category-specific limits per card.\nMeera Srinivasan: What do we need to sign for the pilot?\nPriya Sharma: Just a pilot MoU — lighter than a full MSA. I'll send it today.\nMeera Srinivasan: Great. We'd like to go live by September 1st.\nPriya Sharma: That's very achievable. I'll prioritize your setup.\nMeera Srinivasan: Excellent. Thanks Priya!","ai_summary":{"executive":"Pilot approved by Oasis Foods procurement head. 30 virtual cards over 3 months for vendor payments. Target go-live September 1st. Pilot MoU to be sent today.","evidence":"Meera Srinivasan: 'Our procurement head just approved moving ahead with a pilot.' Target date: 'We'd like to go live by September 1st.'","negative_scope":"Pilot MoU not yet signed. Go-live date depends on timely signing and setup. Full commercial agreement follows successful pilot — not yet committed.","action_items":"Priya Sharma to send pilot MoU to Meera Srinivasan today. Prioritize onboarding setup for September 1st go-live target."}},{"source_type":"call","source_id":"a1b2c3d4-0015-4abc-8def-000000000015","record_ref":"C15","revision":1,"company":"Titan Infrastructure Ltd","rep_name":"Rohan Verma","timestamp":"2026-08-21T14:30:00+05:30","duration_seconds":502,"has_transcript":true,"is_silent":false,"auto_route":"Sales Coaching","transcript":"Rohan Verma: Hi Mr. Rathi, this is Rohan from Volopay.\nMr. Rathi: What is this about?\nRohan Verma: We help infrastructure companies manage project-level expenses with virtual cards and real-time reporting.\nMr. Rathi: We have 40+ ongoing projects. How would this work for us?\nRohan Verma: You can issue a card per project with a budget allocation. All spend is tracked in real time against the project budget.\nMr. Rathi: Interesting. Our biggest pain is petty cash management across sites. Can this replace petty cash?\nRohan Verma: Partially — for digital vendor payments yes. For physical cash disbursements, that's out of scope.\nMr. Rathi: Hmm. Most of our site expenses are cash. This might not fit our use case well.\nRohan Verma: Fair point. If you have any digital vendor spend, we're still relevant there. Could be a starting point.\nMr. Rathi: Maybe. Send me some info and I'll think about it.\nRohan Verma: Will do. Thank you for your time, Mr. Rathi.","ai_summary":{"executive":"Exploratory call with Titan Infrastructure — limited product fit identified. Prospect's primary pain is physical cash management across 40+ sites, which is out of Volopay's scope. Weak opportunity.","evidence":"Mr. Rathi: 'Most of our site expenses are cash. This might not fit our use case well.'","negative_scope":"No buying signal. Physical cash disbursement is out of scope — confirmed by Rohan. Prospect's core use case is not met by product.","action_items":"Rohan to send general info. Manager: review qualification framework — Rohan should have identified cash-heavy use case earlier to qualify out sooner."}},{"source_type":"call","source_id":"a1b2c3d4-0016-4abc-8def-000000000016","record_ref":"C16","revision":1,"company":"Lumina EdTech","rep_name":"Sneha Patel","timestamp":"2026-08-21T15:00:00+05:30","duration_seconds":845,"has_transcript":true,"is_silent":false,"auto_route":"Deal Next Steps","transcript":"Sneha Patel: Hi Kavitha, Sneha from Volopay. How has your week been?\nKavitha Menon: Busy! But good. We just closed our Series B — ₹120 crores.\nSneha Patel: Congratulations! That's a great milestone. Post-fundraise, expense management becomes even more critical.\nKavitha Menon: Exactly why I wanted to talk to you. Our investor relations team says we need a proper spend management platform before our next board review.\nSneha Patel: Perfect timing. What's your current team size and spend volume?\nKavitha Menon: 85 employees, roughly ₹40 lakhs a month in vendor spend.\nSneha Patel: At that scale, I'd recommend our Growth plan. It includes unlimited virtual cards, AP automation, and board-ready reports.\nKavitha Menon: Board-ready reports — what does that mean exactly?\nSneha Patel: Automated burn rate dashboards, departmental P&L views, and investor-formatted spend summaries. Your CFO will love it.\nKavitha Menon: Our CFO Arun will definitely want to see this. Can we schedule a demo next week with him?\nSneha Patel: Absolutely. What day works?\nKavitha Menon: Tuesday after 11 AM works for us.\nSneha Patel: I'll send a Tuesday 11:30 AM invite for Arun and you.\nKavitha Menon: Perfect. Looking forward to it!","ai_summary":{"executive":"High-value post-Series B opportunity with Lumina EdTech. 85 employees, ₹40L/month vendor spend. CFO demo booked for next Tuesday.","evidence":"Kavitha Menon: 'Our investor relations team says we need a proper spend management platform before our next board review.'","negative_scope":"No pricing discussed. CFO Arun has not yet seen the product. Deal is early-stage despite strong intent signals.","action_items":"Sneha Patel to send Tuesday 11:30 AM demo invite for Kavitha Menon and CFO Arun at Lumina EdTech."}},{"source_type":"call","source_id":"a1b2c3d4-0017-4abc-8def-000000000017","record_ref":"C17","revision":1,"company":"Helix Biomedical","rep_name":"Vikram Singh","timestamp":"2026-08-21T15:30:00+05:30","duration_seconds":635,"has_transcript":true,"is_silent":false,"auto_route":"Internal / Vendor Strategy","transcript":"Vikram Singh: Hi Sanjay, Vikram from Volopay. Good afternoon.\nSanjay Bose: Hi Vikram. I know why you're calling — you're one of the vendors on our RFP shortlist.\nVikram Singh: That's right. I wanted to understand your evaluation criteria better so we can tailor our response.\nSanjay Bose: Sure. Our top 3 criteria: integration with our existing HRMS, compliance with GMP audit trails for pharma expense reporting, and local INR support.\nVikram Singh: All three are strengths for us. We have a native HRMS integration with DarwinBox and Keka. Our audit trail is immutable and timestamped. And INR is our primary currency.\nSanjay Bose: What about multi-currency for our Singapore subsidiary?\nVikram Singh: Supported — SGD, USD, EUR, GBP. Multi-currency reconciliation is built in.\nSanjay Bose: Good. RFP re const compositeKey = (r) => `${r.source_type}::${r.source_id}`;

const fmtDuration = (s) => {
  if (!s) return '—';
  const m = Math.floor(s/60), sec = s%60;
  return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
};

const fmtTime = (iso) => {
  try {
    return new Date(iso).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'});
  } catch { return iso; }
};

/* ============================================================

   ============================================================ */
const loadState = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return { records: {}, overrides: {}, loadedBatches: [], selectedKey: null, activeTab: 'inbox', filters: { sourceType: 'all', person: 'all' } };
};

const saveState = (state) => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
};

/* ============================================================
   REPLAY ENGINE
   ============================================================ */
const applyBatch = (currentRecords, batch) => {
  const updated = { ...currentRecords };
  let added = 0, skipped = 0, upgraded = 0;
  for (const rec of batch.records) {
    const key = compositeKey(rec);
    if (!updated[key]) {
      updated[key] = { ...rec, _batchId: batch.batch_id };
      added++;
    } else if (rec.revision > updated[key].revision) {
      updated[key] = { ...rec, _batchId: batch.batch_id };
      upgraded++;
    } else {
      skipped++;
    }
  }
  return { records: updated, stats: { added, skipped, upgraded } };
};

const ReplayPanel = ({ loadedBatches, onLoad, onReset, notify }) => {
  const [log, setLog] = useState([]);
  const addLog = (msg, type='info') => setLog(prev => [{msg, type, ts: new Date().toLocaleTimeString()}, ...prev].slice(0,8));

  const handleLoad = (batchId, batch, label) => {
    const result = onLoad(batchId, batch);
    if (result.alreadyLoaded) {
      addLog(`⚠️ ${label} was already loaded — running deduplication check...`, 'warn');
      setTimeout(() => addLog(`✅ Dedup check complete: ${result.stats.skipped} records skipped (no inflation), ${result.stats.upgraded} upgraded. Total: ${result.totalCount}`, 'success'), 600);
    } else {
      addLog(`✅ ${label} loaded: +${result.stats.added} new, ${result.stats.upgraded} upgraded, ${result.stats.skipped} skipped. Total: ${result.totalCount}`, 'success');
    }
    notify && notify(`${label} applied`, 'success');
  };

  return (
    <div style={{ background: 'var(--bg-surface)', borderBottom: '1px solid var(--border)', padding: '10px 20px', display: 'flex', gap: 10, alignItems: 'flex-start', flexShrink: 0, flexWrap: 'wrap' }}>

        <button id="btn-load-initial" className="btn btn-secondary" onClick={() => handleLoad('01_initial', BATCH_01, 'Initial Batch (01)')}>
          📦 Load Initial Batch (01)
        </button>
        <button id="btn-reimport-initial" className="btn btn-amber" onClick={() => handleLoad('01_initial', BATCH_01, 'Re-import Initial')}>
          🔄 Re-import Initial (Dedup)
        </button>
        <button id="btn-apply-update" className="btn btn-success" onClick={() => handleLoad('02_update', BATCH_02, 'Update Batch (02)')}>
          ⬆ Apply Update (02)
        </button>
        <button id="btn-reset" className="btn btn-danger" onClick={() => { onReset(); setLog([]); addLog('🗑 State cleared — clean slate.', 'warn'); }}>
          🗑 Reset State
        </button>
      </div>
      {log.length > 0 && (
        <div style={{ flex: 1, minWidth: 300 }}>
          {log.slice(0,3).map((l,i) => (
            <div key={i} className="mono" style={{ fontSize: 10.5, padding: '2px 8px', borderRadius: 4, marginBottom: 2,

      )}

  );

const TranscriptViewer = ({ record }) => {
  if (!record.has_transcript || !record.transcript) {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', gap: 12, color: 'var(--text-muted)' }}>
        <span style={{ fontSize: 40 }}>{record.is_silent ? '🔇' : '⏳'}</span>
        <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-secondary)' }}>
          {record.is_silent ? 'Silent / No Audio Recorded' : 'Transcript Not Yet Available'}
        </div>
        <div style={{ fontSize: 12 }}>{record.is_silent ? 'Call connected but no audio was captured.' : 'Processing in progress. Apply update batch to receive transcript.'}</div>
      </div>
    );
  }

  if (Array.isArray(record.transcript)) {
    // Meeting: turn-by-turn
    const speakerColors = {};
    const palette = ['#4f7cff','#22c55e','#f59e0b','#a855f7','#06b6d4','#f97316'];
    let ci = 0;
    const getColor = (sp) => { if (!speakerColors[sp]) { speakerColors[sp] = palette[ci++ % palette.length]; } return speakerColors[sp]; };
    return (
      <div style={{ overflowY: 'auto', height: '100%', padding: '4px 4px 4px 0' }}>
        {record.transcript.map((turn, i) => {
          const color = getColor(turn.speaker);
          return (
            <div key={i} style={{ display: 'flex', gap: 12, marginBottom: 16, animation: 'fadeIn 0.2s ease' }}>
              <div style={{ flexShrink: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
                <div style={{ width: 32, height: 32, borderRadius: '50%', background: color+'22', border: `2px solid ${color}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 700, color }}>
                  {turn.speaker.split(' ').map(w=>w[0]).join('').slice(0,2)}
                </div>
                <span className="mono" style={{ fontSize: 9, color: 'var(--text-muted)' }}>{turn.time}</span>
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color, marginBottom: 4 }}>{turn.speaker}</div>
                <div style={{ fontSize: 13, color: 'var(--text-primary)', lineHeight: 1.6, background: 'var(--bg-elevated)', padding: '8px 12px', borderRadius: '0 10px 10px 10px', border: '1px solid var(--border)' }}>
                  {turn.text}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  // Call: plain text
  const lines = record.transcript.split('\n').filter(l => l.trim());
  return (
    <div style={{ overflowY: 'auto', height: '100%', padding: '4px' }}>
      {lines.map((line, i) => {
        const colonIdx = line.indexOf(':');
        const speaker = colonIdx > -1 ? line.slice(0, colonIdx) : null;
        const text = colonIdx > -1 ? line.slice(colonIdx + 1).trim() : line;
        const isRep = speaker && !speaker.includes('Prospect') && !speaker.includes('Receptionist') && !speaker.includes('Mr.') && !speaker.includes('Mrs.') && !speaker.includes('Dr.');
        return (
          <div key={i} style={{ marginBottom: 12, display: 'flex', gap: 10, flexDirection: isRep ? 'row' : 'row-reverse' }}>
            {speaker && (
              <div style={{ flexShrink: 0, fontSize: 11, fontWeight: 700, color: isRep ? 'var(--accent)' : 'var(--text-muted)', minWidth: 100, textAlign: isRep ? 'left' : 'right', paddingTop: 2 }}>
                {speaker}
              </div>
            )}
            <div style={{ flex: 1, fontSize: 13, color: 'var(--text-primary)', lineHeight: 1.6, background: isRep ? 'var(--accent-soft)' : 'var(--bg-elevated)', padding: '8px 12px', borderRadius: isRep ? '10px 10px 10px 2px' : '10px 10px 2px 10px', border: `1px solid ${isRep ? 'var(--accent)' : 'var(--border)'}`, borderColor: isRep ? 'rgba(79,124,255,0.3)' : 'var(--border)', maxWidth: '80%' }}>
              {text}
            </div>
          </div>
        );
      })}
    </div>
  );
};

/* ============================================================
   ROUTE PANEL
   ============================================================ */
const RoutePanel = ({ record, override, onSaveRoute }) => {
  const key = compositeKey(record);
  const currentRoute = override?.route || record.auto_route;
  const [selectedRoute, setSelectedRoute] = useState(currentRoute);
  const [notes, setNotes] = useState(override?.notes || '');
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    setSelectedRoute(override?.route || record.auto_route);
    setNotes(override?.notes || '');
  }, [key]);

  const handleSave = () => {
    onSaveRoute(key, selectedRoute, notes);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div style={{ overflowY: 'auto', height: '100%', display: 'flex', flexDirection: 'column', gap: 16, padding: '4px' }}>
      <div style={{ background: 'var(--bg-elevated)', border: '1px solid var(--border)', borderRadius: 12, padding: 16 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 10, letterSpacing: '0.5px' }}>CURRENT ASSIGNMENT</div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
          <RouteTag route={currentRoute} />
          {override?.manual_override
            ? <Tag color="#a855f7" bg="var(--purple-soft)">✏ Manually Overridden</Tag>
            : <Tag color="var(--text-muted)" bg="var(--bg-hover)">🤖 AI Auto-routed</Tag>}
        </div>
        {override?.updated_at && (
          <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 8 }}>Last updated: {new Date(override.updated_at).toLocaleString()}</div>
        )}
      </div>

      <div style={{ background: 'var(--bg-elevated)', border: '1px solid var(--border)', borderRadius: 12, padding: 16 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 12, letterSpacing: '0.5px' }}>REASSIGN ROUTE</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {ROUTES.map(route => {
            const cfg = ROUTE_CONFIG[route];
            const isSelected = selectedRoute === route;
            return (
              <div key={route} onClick={() => setSelectedRoute(route)}
                style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px', borderRadius: 8, cursor: 'pointer', border: `1px solid ${isSelected ? cfg.color : 'var(--border)'}`, background: isSelected ? cfg.bg : 'var(--bg-surface)', transition: 'all 0.15s' }}>

                  {isSelected && <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#fff' }}></div>}
                </div>
                <span style={{ fontSize: 13, fontWeight: isSelected ? 600 : 400, color: isSelected ? cfg.color : 'var(--text-secondary)' }}>{cfg.icon} {route}</span>

      <div style={{ background: 'var(--bg-elevated)', border: '1px solid var(--border)', borderRadius: 12, padding: 16 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 10, letterSpacing: '0.5px' }}>MANAGER NOTES</div>

    return {
      source_type: r.source_type,
      source_id: r.source_id,
      record_ref: r.record_ref,
      applied_revision: r.revision,
      route,
      output_path: cfg.folder + `${r.record_ref}_${r.source_id.slice(0,8)}.json`,
      review_state: r.has_transcript ? 'reviewed' : 'pending',
      manual_override: override?.manual_override || false,
      analysis_freshness: r.has_transcript ? 'current' : 'no_transcript',
      notes: override?.notes || null,
    };
  });
  const manifest = { generated_at: new Date().toISOString(), date_scope: '2026-08-21', timezone: 'Asia/Kolkata', total_records: rows.length, records: rows };
  const blob = new Blob([JSON.stringify(manifest, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rii_manifest_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

const exportCSV = (records, overrides) => {
  const header = ['source_type','source_id','record_ref','applied_revision','route','output_path','review_state','manual_override','analysis_freshness'];
  const rows = Object.values(records).map(r => {
    const key = compositeKey(r);
    const override = overrides[key];
    const route = override?.route || r.auto_route;
    const cfg = ROUTE_CONFIG[route] || ROUTE_CONFIG['Unprocessed / Low Signal'];
    return [
      r.source_type, r.source_id, r.record_ref, r.revision,
      `"${route}"`, cfg.folder + `${r.record_ref}_${r.source_id.slice(0,8)}.json`,
      r.has_transcript ? 'reviewed' : 'pending', override?.manual_override || false,
      r.has_transcript ? 'current' : 'no_transcript'
    ].join(',');
  });
  const csv = [header.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rii_manifest_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

/* ============================================================
   NOTIFICATION TOAST
   ============================================================ */
const Toast = ({ message, type, onClose }) => {
  useEffect(() => {
    const t = setTimeout(onClose, 3000);
    return () => clearTimeout(t);
  }, [message]);
  return (
    <div style={{ position: 'fixed', bottom: 24, right: 24, padding: '12px 20px', borderRadius: 10, background: type === 'success' ? '#14532d' : '#7f1d1d', border: `1px solid ${type === 'success' ? '#22c55e' : '#ef4444'}`, color: '#fff', fontSize: 13, fontWeight: 600, zIndex: 9999, animation: 'fadeIn 0.2s ease', display: 'flex', gap: 8, alignItems: 'center', boxShadow: '0 8px 32px rgba(0,0,0,0.5)' }}>
      {type === 'success' ? '✅' : '❌'} {message}
    </div>
  );
};

/* ============================================================
   MAIN APP
   ============================================================ */
const App = () => {
  const [state, setState] = useState(loadState);
  const [toast, setToast] = useState(null);

  const notify = (msg, type = 'success') => setToast({ msg, type });

  useEffect(() => { saveState(state); }, [state]);

  const applyBatchToState = useCallback((batchId, batch) => {
    let result;
    setState(prev => {
      const alreadyLoaded = prev.loadedBatches.includes(batchId);
      const { records: newRecords, stats } = applyBatch(prev.records, batch);
      const newState = {
        ...prev,
        records: newRecords,
        loadedBatches: alreadyLoaded ? prev.loadedBatches : [...prev.loadedBatches, batchId],
      };
      result = { alreadyLoaded, stats, totalCount: Object.keys(newRecords).length };
      return newState;
    });
    return result || {};
  }, []);

  const resetState = useCallback(() => {
    const fresh = { records: {}, overrides: {}, loadedBatches: [], selectedKey: null, activeTab: 'inbox', filters: { sourceType: 'all', person: 'all' } };
    setState(fresh);
    notify('State cleared', 'success');
  }, []);

  const saveRoute = useCallback((key, route, notes) => {
    setState(prev => ({
      ...prev,
      overrides: {
        ...prev.overrides,
        [key]: { ...prev.overrides[key], route, notes, manual_override: true, updated_at: new Date().toISOString() }
      }
    }));
    notify('Route override saved', 'success');
  }, []);

  const setFilters = useCallback((fn) => {
    setState(prev => ({ ...prev, filters: typeof fn === 'function' ? fn(prev.filters) : fn }));
  }, []);

  const setActiveTab = useCallback((tab) => {
    setState(prev => ({ ...prev, activeTab: tab }));
  }, []);

  const setSelectedKey = useCallback((key) => {
    setState(prev => ({ ...prev, selectedKey: key }));
  }, []);

  const { records, overrides, loadedBatches, selectedKey, activeTab, filters } = state;

  const filteredRecords = useMemo(() => {
    let arr = Object.values(records);
    if (filters.sourceType !== 'all') arr = arr.filter(r => r.source_type === filters.sourceType);
    if (filters.person !== 'all') arr = arr.filter(r => {
      const p = r.source_type === 'call' ? r.rep_name : r.organizer_email;
      return p === filters.person;
    });
    return arr.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  }, [records, filters]);

  const selectedRecord = selectedKey ? records[selectedKey] : null;
  const selectedOverride = selectedKey ? overrides[selectedKey] : null;

  return (
    <div id="root-app" style={{ height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <TopBar activeTab={activeTab} setActiveTab={setActiveTab} />

      {activeTab === 'inbox' && (
        <>
          <MetricsBar records={records} overrides={overrides} filters={filters} setFilters={setFilters} notify={notify} />
          <ReplayPanel loadedBatches={loadedBatches} onLoad={applyBatchToState} onReset={resetState} notify={notify} />

          {/* Export Bar */}
          <div style={{ background: 'var(--bg-surface)', borderBottom: '1px solid var(--border)', padding: '8px 20px', display: 'flex', gap: 8, alignItems: 'center', flexShrink: 0 }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-muted)', letterSpacing: '0.5px' }}>📤 EXPORT:</span>
            <button id="export-json" className="btn btn-secondary" onClick={() => { exportManifest(records, overrides); notify('JSON manifest downloaded', 'success'); }}>⬇ JSON Manifest</button>
            <button id="export-csv" className="btn btn-secondary" onClick={() => { exportCSV(records, overrides); notify('CSV manifest downloaded', 'success'); }}>⬇ CSV Manifest</button>
            <span style={{ fontSize: 11, color: 'var(--text-muted)', marginLeft: 8 }}>Folders: deals/ · support/ · coaching/ · vendor/ · unprocessed/</span>
            <div style={{ flex: 1 }}></div>
            <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>{filteredRecords.length} records shown</span>
          </div>

          {/* Main Split Layout */}
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            {/* Left: Inbox Feed */}
            <div style={{ width: 340, flexShrink: 0, borderRight: '1px solid var(--border)', overflowY: 'auto', background: 'var(--bg-surface)' }}>
              {filteredRecords.length === 0 ? (
                <div style={{ padding: 32, textAlign: 'center', color: 'var(--text-muted)' }}>
                  <div style={{ fontSize: 36, marginBottom: 12 }}>📭</div>
                  <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, color: 'var(--text-secondary)' }}>No records loaded</div>
                  <div style={{ fontSize: 12 }}>Use the Replay controls above to load a batch.</div>
                </div>
              ) : (
                filteredRecords.map(r => (
                  <InboxCard key={compositeKey(r)} record={r} override={overrides[compositeKey(r)]} isSelected={compositeKey(r) === selectedKey} onClick={() => setSelectedKey(compositeKey(r))} />
                ))
              )}
            </div>

            {/* Right: Workspace */}
            <div style={{ flex: 1, overflow: 'hidden', background: 'var(--bg-base)' }}>
              <ConversationWorkspace record={selectedRecord} override={selectedOverride} onSaveRoute={saveRoute} />
            </div>
          </div>
        </>
      )}

      {activeTab === 'brief' && (
        <div style={{ flex: 1, overflow: 'hidden' }}>
          <ManagerDailyBrief records={records} overrides={overrides} />
        </div>
      )}

      {toast && <Toast message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
